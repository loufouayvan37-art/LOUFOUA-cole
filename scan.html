<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Scan - Marie Curie</title>
  <script src="https://cdn.jsdelivr.net/npm/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
  <style>
    body { font-family: sans-serif; text-align: center; background: #0b3d91; color: #fff; margin: 0; padding: 20px; }
    h1 { font-size: 2em; }
    #reader { max-width: 500px; margin: 0 auto; background: #000; border-radius: 12px; overflow: hidden; }
    button, a.btn { padding: 16px 32px; font-size: 1.2em; border: 0; border-radius: 8px;
                    background: #fff; color: #0b3d91; text-decoration: none; cursor: pointer; }
    #resultat { display: none; position: fixed; inset: 0; background: #2e7d32; color: #fff;
                flex-direction: column; align-items: center; justify-content: center; font-size: 1.8em; }
    #resultat a { color: #fff; margin-top: 30px; font-size: 0.7em; }
  </style>
</head>
<body>
  <h1>Présentez votre QR code</h1>
  <button id="start" onclick="demarrer()">▶ Démarrer le scan</button>
  <div id="reader"></div>
  <p id="erreur"></p>
  <p><a class="btn" href="historique.html">Voir l'historique</a></p>

  <div id="resultat">
    <div>✔ Scan enregistré</div>
    <div id="contenu" style="margin-top:20px; font-weight:bold;"></div>
    <a href="historique.html">Voir l'historique</a>
  </div>

  <script>
    const CLE = 'historique_scans';   // même clé que historique.html
    let audio, bloque = false;

    function bip() {
      audio.resume();
      const osc = audio.createOscillator();
      osc.frequency.value = 1200;
      osc.connect(audio.destination);
      osc.start();
      osc.stop(audio.currentTime + 0.25);
    }

    function enregistrer(code) {
      let h = [];
      try { h = JSON.parse(localStorage.getItem(CLE)) || []; } catch (e) {}
      h.unshift({ code: code, date: new Date().toISOString() });
      localStorage.setItem(CLE, JSON.stringify(h.slice(0, 500)));
    }

    function onScan(texte) {
      if (bloque) return;          // évite les doublons pendant l'affichage
      bloque = true;
      bip();
      enregistrer(texte);
      document.getElementById('contenu').textContent = texte;
      document.getElementById('resultat').style.display = 'flex';
      setTimeout(() => {
        document.getElementById('resultat').style.display = 'none';
        bloque = false;            // le scan reprend automatiquement
      }, 4000);
    }

    async function demarrer() {
      audio = new (window.AudioContext || window.webkitAudioContext)();  // débloqué par le toucher
      audio.resume();
      document.getElementById('start').style.display = 'none';
      try {
        const scanner = new Html5Qrcode('reader');
        await scanner.start(
          { facingMode: 'user' },            // 'user' = caméra avant, 'environment' = arrière
          { fps: 10, qrbox: 250 },
          onScan,
          () => {}
        );
      } catch (e) {
        document.getElementById('erreur').textContent = "Caméra inaccessible : " + e;
      }
    }
  </script>
</body>
</html>
